name: StockPilot Backend CI

on:
  push:
    branches:
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.props'
      - '**/*.targets'
      - '**/appsettings*.json'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '**/*.slnx'
      - '**/*.props'
      - '**/*.targets'
      - '**/appsettings*.json'
      - '.github/workflows/backend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore backend-stockpilot.slnx

      - name: Build solution
        run: dotnet build backend-stockpilot.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Tests/StockPilot.UnitTests/StockPilot.UnitTests.csproj --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test Tests/StockPilot.IntegrationTests/StockPilot.IntegrationTests.csproj --configuration Release --no-build